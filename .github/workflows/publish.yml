name: 인스타 자동 게시

on:
  schedule:
    - cron: "7 * * * *"   # 매시 7분마다 확인 → 게시 시각이 지난 게시물을 하나씩 올려요 (깃허브가 붐비면 조금 늦을 수 있어요)
  workflow_dispatch:
    inputs:
      mode:
        description: "check: 토큰 확인만 / dry-run: 올릴 게시물 확인만(게시 안 함) / publish: 지금 게시"
        type: choice
        options: [check, dry-run, publish]
        default: check

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 게시 시각이 된 카드뉴스 올리기
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
        run: python3 scripts/publish.py

      - name: 게시 기록 저장 (완료·실패 표시)
        if: always()
        run: |
          git config user.name "alzza-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in queue posted; do
            if [ -e "$d" ]; then git add -A -- "$d"; fi
          done
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "인스타 게시 기록 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
